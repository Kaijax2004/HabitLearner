# HabitLearner Nginx SPA配置
# 用于解决Vue Router客户端路由的404问题

server {
    listen 80;
    server_name habitlearner.cn www.habitlearner.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name habitlearner.cn www.habitlearner.cn;
    
    # SSL证书配置（请替换为您的证书路径）
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # 网站根目录
    root /var/www/habitlearner.cn;
    index index.html;
    
    # 关键配置：支持SPA路由
    # 这是解决404错误的核心配置
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 静态资源缓存配置
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }
    
    # 网站图标和图片缓存
    location ~* \.(ico|png|svg|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
    }
    
    # CSS和JS文件缓存
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
    }
    
    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 安全头配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # 隐藏Nginx版本信息
    server_tokens off;
    
    # 错误页面配置
    error_page 404 /index.html;
    
    # 日志配置
    access_log /var/log/nginx/habitlearner.cn.access.log;
    error_log /var/log/nginx/habitlearner.cn.error.log;
}
